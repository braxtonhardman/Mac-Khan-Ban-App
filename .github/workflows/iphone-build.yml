name: iPhone build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Archive and upload the iPhone app to App Store Connect"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  simulator-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build iPhone app for Simulator
        run: |
          xcodebuild \
            -project ProjectBoard.xcodeproj \
            -scheme "ProjectBoard iPhone iCloud" \
            -configuration Debug-iCloud \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/ProjectBoardDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

  testflight-upload:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight) }}
    needs: simulator-build
    runs-on: macos-26
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check signing credentials
        run: |
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY"
      - name: Prepare signing key and export options
        run: |
          umask 077
          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>92F54J4WUJ</string>
            <key>manageAppVersionAndBuildNumber</key><true/>
          </dict></plist>
          PLIST
      - name: Probe App Store Connect access
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const key = fs.readFileSync(process.env.RUNNER_TEMP + '/AuthKey.p8');
          const enc = o => Buffer.from(JSON.stringify(o)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const body = enc({iss: process.env.APP_STORE_CONNECT_ISSUER_ID, iat: now, exp: now + 300, aud: 'appstoreconnect-v1'});
          const head = enc({alg: 'ES256', kid: process.env.APP_STORE_CONNECT_KEY_ID, typ: 'JWT'});
          const input = head + '.' + body;
          const signature = crypto.sign('sha256', Buffer.from(input), {key, dsaEncoding: 'ieee-p1363'}).toString('base64url');
          const endpoints = [
            ['app lookup', '/v1/apps?filter%5BbundleId%5D=com.braxtonhardman.ProjectBoard&fields%5Bapps%5D=bundleId,name&limit=10'],
            ['distribution certificates', '/v1/certificates?filter%5BcertificateType%5D=DISTRIBUTION&limit=10'],
            ['App Store profiles', '/v1/profiles?filter%5BprofileType%5D=IOS_APP_STORE&limit=10']
          ];
          (async () => {
            for (const [label, path] of endpoints) {
              try {
                const res = await fetch('https://api.appstoreconnect.apple.com' + path, {headers: {Authorization: 'Bearer ' + input + '.' + signature}});
                const data = await res.json();
                const codes = (data.errors || []).map(e => e.code || e.status).join(',');
                console.log(label + ': HTTP ' + res.status + ', records=' + (data.data?.length ?? 'n/a') + (codes ? ', error codes=' + codes : ''));
                if (label === 'app lookup' && res.ok) console.log('bundle IDs: ' + data.data.map(e => e.attributes?.bundleId).join(','));
              } catch (e) { console.log(label + ': request failed (' + e.name + ')'); }
            }
          })();
          JS
      - name: Archive iPhone app
        run: |
          xcodebuild \
            -project ProjectBoard.xcodeproj \
            -scheme "ProjectBoard iPhone iCloud" \
            -configuration Release-iCloud \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/ProjectBoard.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            archive
      - name: Upload to App Store Connect
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ProjectBoard.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/Export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
      - name: Diagnose export failure
        if: failure()
        run: |
          log_dir="$(find "$TMPDIR" -type d -name '*.xcdistributionlogs' -print -quit)"
          if [ -z "$log_dir" ]; then
            echo "No Xcode distribution log bundle found."
            exit 0
          fi
          for name in IDEDistribution.critical.log IDEDistribution.standard.log; do
            log_file="$log_dir/$name"
            if [ -f "$log_file" ]; then
              echo "Relevant $name messages:"
              grep -iE 'error|fail|forbidden|unauthorized|permission|status' "$log_file" \
                | grep -viE 'Authorization:|Bearer |token=|PRIVATE KEY|password=' \
                | tail -n 60 \
                | cut -c 1-400 || true
            fi
          done
